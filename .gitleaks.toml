# Gitleaks Configuration for UTF Strings Project
# https://github.com/gitleaks/gitleaks

title = "Gitleaks configuration for UTF Strings"

[extend]
# Use the default Gitleaks rules as a base
useDefault = true

# Global allowlist for common false positives
[allowlist]
description = "Global allowlist for common false positives"
paths = [
  # Version control
  '''\.git/.*''',
  '''\.gitignore$''',
  '''\.gitattributes$''',
  
  # IDE files
  '''\.vscode/.*''',
  '''\.idea/.*''',
  '''.*\.swp$''',
  '''.*\.swo$''',
  
  # Build directories and generated files
  '''.*\/build\/.*''',
  '''.*\.cmake$''',
  '''.*Makefile$''',
  '''.*\.ninja$''',
  '''.*CMakeCache\.txt$''',
  
  # Conan generated files
  '''.*conanfile\.txt$''',
  '''.*conandata\.yml$''',
  '''.*conan\.lock$''',
  '''.*conanbuild.*''',
  '''.*conanrun.*''',
  '''.*conan_toolchain\.cmake$''',
  '''.*conandeps.*\.cmake$''',
  
  # Test files
  '''.*tests/.*''',
  '''.*test_.*''',
  '''.*fuzz/.*''',
  
  # Documentation
  '''.*\.md$''',
  '''.*\.rst$''',
  '''.*\.txt$''',
  '''.*LICENSE.*''',
  '''.*CHANGELOG.*''',
  '''.*README.*''',
  
  # Performance data
  '''.*\.script$''',
  '''.*bench.*\.cpp$''',
  '''.*perf\..*''',
  
  # Package manager files  
  '''package-lock\.json$''',
  '''yarn\.lock$''',
  '''Pipfile\.lock$''',
  
  # Compiled binaries and objects
  '''.*\.o$''',
  '''.*\.obj$''',
  '''.*\.exe$''',
  '''.*\.dll$''',
  '''.*\.so$''',
  '''.*\.dylib$''',
  '''.*\.a$''',
  '''.*\.lib$''',
  
  # Archives
  '''.*\.zip$''',
  '''.*\.tar\.gz$''',
  '''.*\.tar\.bz2$''',
  '''.*\.7z$''',
]

regexes = [
  # Common template patterns that aren't secrets
  '''.*\{\{.*\}\}.*''',  # Template variables
  '''.*\$\{.*\}.*''',    # Shell/env variables
  '''.*\%.*\%.*''',      # Windows env variables
]