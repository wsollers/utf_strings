name: Performance Baseline Tracking

on:
  # Trigger on pushes to main branch
  push:
    branches: [main]

  # Allow manual triggering
  workflow_dispatch:

  # Trigger on workflow runs completion to get artifacts
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    branches: [main]
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  performance-tracking:
    name: "Performance Baseline Tracking"
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake python3-pip git
          # Install Clang 18 for high-performance release builds
          sudo apt install -y clang-18 libc++-18-dev libc++abi-18-dev
          # Install profiling tools for flame graph generation
          # Install kernel-specific perf tools to avoid version mismatch
          KERNEL_VERSION=$(uname -r)
          echo "Kernel version: $KERNEL_VERSION"
          # Try to install kernel-specific perf first, fallback to generic
          sudo apt install -y linux-tools-$KERNEL_VERSION || sudo apt install -y linux-tools-generic linux-tools-common
          sudo apt install -y perf-tools-unstable
          # Install FlameGraph tools
          git clone https://github.com/brendangregg/FlameGraph.git /tmp/FlameGraph
          sudo cp /tmp/FlameGraph/*.pl /usr/local/bin/
          sudo chmod +x /usr/local/bin/*.pl
          # Set up alternatives to use Clang 18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Set perf permissions
        run: |
          # Allow perf to run without root for non-paranoid mode
          sudo sysctl -w kernel.perf_event_paranoid=-1 || echo "Could not set perf_event_paranoid"
          sudo sysctl -w kernel.kptr_restrict=0 || echo "Could not set kptr_restrict"
          # Additional perf permission settings for containers
          echo 0 | sudo tee /proc/sys/kernel/perf_event_paranoid || echo "Could not write to perf_event_paranoid proc"
          echo 0 | sudo tee /proc/sys/kernel/kptr_restrict || echo "Could not write to kptr_restrict proc"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip3 install --user conan
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Conan profile
        run: |
          conan profile detect --force
          # Use Clang 18 with libstdc++ for performance builds (avoids GoogleTest linking issues)
          sed -i 's/compiler=.*/compiler=clang/' ~/.conan2/profiles/default
          sed -i 's/compiler.version=.*/compiler.version=18/' ~/.conan2/profiles/default
          sed -i 's/compiler.libcxx=.*/compiler.libcxx=libstdc++11/' ~/.conan2/profiles/default
          sed -i 's/compiler.cppstd=.*/compiler.cppstd=23/' ~/.conan2/profiles/default
          sed -i 's/os=.*/os=Linux/' ~/.conan2/profiles/default
          sed -i 's/arch=.*/arch=x86_64/' ~/.conan2/profiles/default
          echo "=== Conan Profile ==="
          conan profile show --profile:host=default

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-performance-baseline-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-performance-baseline-

      - name: Install dependencies
        run: |
          export CC=clang-18
          export CXX=clang++-18
          conan install . -s os=Linux -s build_type=Release --output-folder=build --build=missing -o with_gperftools=True

      - name: Configure and Build (Release)
        run: |
          export CC=clang-18
          export CXX=clang++-18
          cmake --preset conan-release \
            -DCOMPILER_TYPE=CLANG \
            -DUSE_LTO=OFF \
            -DUSE_NATIVE_ARCH=ON \
            -DUSE_LIBC_PLUS_PLUS=OFF \
            -DENABLE_SHARED_LIBRARY=ON
          cmake --build --preset conan-release --parallel

      - name: Run Performance Benchmarks and Generate Flame Graphs
        run: |
          cd build/build

          # Create docs/performance directory for all performance reports
          mkdir -p ../../docs/performance

          # Debug current working directory and permissions
          echo "=== DEBUGGING INFO ==="
          echo "Current working directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo "Benchmark executable:"
          ls -la ./utf_strings-bench
          echo "File permissions in current directory:"
          ls -ld .
          echo "Free disk space:"
          df -h .
          echo "=== END DEBUG ==="

          # 1. Standard benchmark run for historical tracking
          echo "Running standard benchmarks..."
          ./utf_strings-bench --benchmark_min_time=1.0s --benchmark_format=json --benchmark_out=performance_baseline.json

          # 2. Extended benchmark run for detailed analysis
          echo "Running extended benchmarks..."
          ./utf_strings-bench --benchmark_min_time=3.0s --benchmark_format=json --benchmark_out=../../docs/performance/detailed_benchmark.json

          # 3. Generate flame graphs with perf (if available)
          echo "Generating flame graphs..."
          if command -v perf >/dev/null 2>&1; then
            # Try to run perf - may fail in containerized environment
            echo "Perf version info:"
            perf --version || echo "Could not get perf version"
            echo "Kernel version: $(uname -r)"
            echo "Perf event paranoid setting: $(cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || echo 'unknown')"
            echo "Kptr restrict setting: $(cat /proc/sys/kernel/kptr_restrict 2>/dev/null || echo 'unknown')"
            echo "Available perf events: $(perf list hw 2>&1 | head -5 || echo 'could not list events')"
            echo "Current user: $(whoami)"
            echo "User groups: $(groups)"
            echo "Attempting perf record with diagnostic output..."
            
            # Clean up any existing perf data files in current and parent directories
            rm -f perf.data*
            rm -f ../perf.data*
            rm -f ../../perf.data*
            
            # Show current directory before perf record
            echo "About to run perf record in directory: $(pwd)"
            echo "Directory listing before perf:"
            ls -la
            
            # Try perf record with explicit output file and verbose output
            echo "Trying perf record with dwarf call-graph and explicit output..."
            PERF_OUTPUT_FILE="./perf.data"
            if perf record -v -o "$PERF_OUTPUT_FILE" -F 99 -g --call-graph dwarf -- ./utf_strings-bench --benchmark_min_time=2.0s --benchmark_repetitions=5; then
              echo "Perf record command completed, checking for output file..."
              echo "Directory listing after perf record:"
              ls -la
              
              if [ -f "$PERF_OUTPUT_FILE" ]; then
                echo "SUCCESS: perf.data file found!"
                ls -la "$PERF_OUTPUT_FILE"
                echo "File size: $(stat -c%s "$PERF_OUTPUT_FILE") bytes"
              else
                echo "ERROR: perf.data file not found at expected location: $PERF_OUTPUT_FILE"
                echo "Searching for perf.data files in current and parent directories:"
                find . -name "perf.data*" -type f 2>/dev/null || echo "No perf.data files found"
                find .. -name "perf.data*" -type f 2>/dev/null || echo "No perf.data files found in parent"
                exit 1
              fi
              
              # Check perf file format and try to process
              echo "Testing perf script compatibility..."
              if perf script -i "$PERF_OUTPUT_FILE" -v > /dev/null 2>&1; then
                echo "Perf file format compatible, generating flame graph..."
                perf script -i "$PERF_OUTPUT_FILE" > ../../docs/performance/perf.script
                if stackcollapse-perf.pl ../../docs/performance/perf.script > ../../docs/performance/perf.folded; then
                  flamegraph.pl ../../docs/performance/perf.folded > ../../docs/performance/flamegraph.svg
                  echo "Flame graph generated successfully"
                else
                  echo "Stack collapse failed, creating placeholder"
                  echo "Perf data processing failed during stack collapse step. File format may be incompatible." > ../../docs/performance/flamegraph_unavailable.txt
                fi
              else
                echo "Perf file format incompatible, trying alternative approach..."
                perf script -i "$PERF_OUTPUT_FILE" -v 2>&1 | head -20 > ../../docs/performance/perf_debug.txt || true
                
                # Try an alternative approach with simpler call graph format
                echo "Attempting alternative perf record with fp call-graph..."
                rm -f "$PERF_OUTPUT_FILE"
                ALT_PERF_FILE="./perf_alt.data"
                if perf record -o "$ALT_PERF_FILE" -F 99 -g --call-graph fp -- ./utf_strings-bench --benchmark_min_time=1.0s --benchmark_repetitions=3; then
                  echo "Alternative perf recording successful, checking file..."
                  if [ -f "$ALT_PERF_FILE" ]; then
                    echo "Alternative perf file created: $(ls -la "$ALT_PERF_FILE")"
                    if perf script -i "$ALT_PERF_FILE" > ../../docs/performance/perf.script 2>/dev/null; then
                      echo "Alternative perf script successful, generating flame graph..."
                      if stackcollapse-perf.pl ../../docs/performance/perf.script > ../../docs/performance/perf.folded; then
                        flamegraph.pl ../../docs/performance/perf.folded > ../../docs/performance/flamegraph.svg
                        echo "Flame graph generated successfully with alternative method"
                      else
                        echo "Stack collapse failed with alternative method"
                        echo "Perf data processing failed during stack collapse step. File format may be incompatible." > ../../docs/performance/flamegraph_unavailable.txt
                      fi
                    else
                      echo "Alternative perf script also failed"
                      echo "Perf file format incompatible with current perf version. This can happen in containerized environments. Debug info saved to perf_debug.txt" > ../../docs/performance/flamegraph_unavailable.txt
                    fi
                  else
                    echo "Alternative perf file not created"
                    echo "Perf file format incompatible with current perf version. This can happen in containerized environments." > ../../docs/performance/flamegraph_unavailable.txt
                  fi
                else
                  echo "Alternative perf record also failed"
                  echo "Perf file format incompatible with current perf version. This can happen in containerized environments." > ../../docs/performance/flamegraph_unavailable.txt
                fi
              fi
            else
              echo "Perf recording failed (likely due to container restrictions), creating placeholder"
              echo "Flame graph generation requires privileged container access or compatible kernel. Run locally with: perf record -g ./utf_strings-bench && perf script | stackcollapse-perf.pl | flamegraph.pl > flamegraph.svg" > ../../docs/performance/flamegraph_unavailable.txt
            fi
          else
            echo "Perf not available, skipping flame graph generation"
            echo "Perf tools not found. Install with: sudo apt install linux-tools-generic" > ../../docs/performance/flamegraph_unavailable.txt
          fi

          # 4. Generate comprehensive benchmark report with multiple formats
          echo "Generating comprehensive reports..."
          ./utf_strings-bench --benchmark_format=console --benchmark_min_time=1.0s > ../../docs/performance/benchmark_console.txt
          ./utf_strings-bench --benchmark_format=csv --benchmark_min_time=1.0s --benchmark_out=../../docs/performance/benchmark_results.csv

          # 5. System information for performance context
          echo "Collecting system information..."
          cat > ../../docs/performance/system_info.txt << EOF
          Performance Benchmark System Information
          Generated: $(date)
          Build: Clang 18 Release with libc++

          CPU Information:
          $(cat /proc/cpuinfo | grep "model name" | head -1)
          $(cat /proc/cpuinfo | grep "cpu MHz" | head -1)
          $(cat /proc/cpuinfo | grep "cache size" | head -1)
          CPU Cores: $(nproc)

          Memory Information:
          $(free -h)

          Compiler Version:
          $(clang++-18 --version)

          Build Flags Used:
          Release build with -O3 -march=native -mtune=native -flto
          EOF

          echo "Performance analysis complete!"
          ls -la ../../docs/performance/

      - name: Prepare complete docs structure for Pages deployment
        run: |
          echo "=== Preparing complete documentation structure ==="
          echo "Repository docs structure:"
          find docs/ -type f | head -20

          echo ""
          echo "=== Performance files generated ==="
          ls -la docs/performance/ 2>/dev/null || echo "No performance directory found"

          echo ""
          echo "=== Jekyll configuration check ==="
          if [ -f "docs/_config.yml" ]; then
            echo "✅ Jekyll config exists"
            ls -la docs/_config.yml
          else
            echo "❌ Jekyll config missing"
          fi

          echo ""
          echo "=== Main index file check ==="  
          if [ -f "docs/index.html" ]; then
            echo "✅ Main index exists"
            ls -la docs/index.html
          else
            echo "❌ Main index missing"
          fi

      - name: Upload performance docs for Pages deployment
        uses: actions/upload-artifact@v4
        with:
          name: performance-docs-for-pages
          path: docs/
          retention-days: 1

      - name: Setup docs directory and create performance index
        run: |
          # Configure git identity for GitHub Actions
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Set up authentication for git push
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # Ensure docs directories exist
          mkdir -p docs/dev/bench
          mkdir -p docs/performance

          # Create performance index page with dynamic file checking
          cat > docs/performance/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>UTF Strings - Performance Analysis</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 2rem;
                      line-height: 1.6;
                      color: #333;
                  }
                  .header {
                      text-align: center;
                      margin-bottom: 3rem;
                      padding-bottom: 2rem;
                      border-bottom: 2px solid #eee;
                  }
                  .card {
                      background: #f8f9fa;
                      border: 1px solid #e9ecef;
                      border-radius: 8px;
                      padding: 1.5rem;
                      margin: 1rem 0;
                  }
                  .card h2 {
                      margin-top: 0;
                      color: #495057;
                  }
                  .btn {
                      display: inline-block;
                      padding: 0.5rem 1rem;
                      background: #007bff;
                      color: white;
                      text-decoration: none;
                      border-radius: 4px;
                      margin: 0.5rem 0.5rem 0.5rem 0;
                  }
                  .btn:hover {
                      background: #0056b3;
                  }
                  .btn.unavailable {
                      background: #6c757d;
                      cursor: not-allowed;
                  }
                  .flame-btn {
                      background: #fd7e14;
                  }
                  .flame-btn:hover {
                      background: #e8690a;
                  }
                  .data-btn {
                      background: #28a745;
                  }
                  .data-btn:hover {
                      background: #1e7e34;
                  }
                  .grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 1rem;
                  }
                  .build-info {
                      background: #e7f3ff;
                      border-left: 4px solid #007bff;
                      padding: 1rem;
                      margin: 1rem 0;
                  }
                  .alert {
                      padding: 1rem;
                      margin: 1rem 0;
                      border-radius: 4px;
                  }
                  .alert-warning {
                      background: #fff3cd;
                      border: 1px solid #ffeaa7;
                      color: #856404;
                  }
                  iframe {
                      width: 100%;
                      height: 600px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                  }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>UTF Strings Performance Analysis</h1>
                  <p>Comprehensive performance benchmarks and profiling results</p>
                  <div class="build-info">
                      <strong>Build Configuration:</strong> Clang 18 Release with libc++, -O3 -march=native -flto
                      <br><strong>Last Updated:</strong> <span id="timestamp"></span>
                  </div>
              </div>
              
              <div class="grid">
                  <div class="card">
                      <h2>Flame Graph Analysis</h2>
                      <p>Interactive flame graph showing CPU time distribution and hot paths in the UTF string processing functions.</p>
                      <div id="flame-graph-links">
                          <a href="flamegraph.svg" class="btn flame-btn" id="flame-graph-btn">View Flame Graph</a>
                          <a href="perf.script" class="btn" id="perf-data-btn">Raw Perf Data</a>
                      </div>
                      <div id="flame-graph-status"></div>
                  </div>
                  
                  <div class="card">
                      <h2>Historical Benchmarks</h2>
                      <p>Interactive charts showing performance trends over time with automatic regression detection.</p>
                      <a href="../dev/bench/" class="btn">View Historical Charts</a>
                  </div>
                  
                  <div class="card">
                      <h2>Detailed Results</h2>
                      <p>Comprehensive benchmark results in multiple formats for analysis and comparison.</p>
                      <a href="detailed_benchmark.json" class="btn data-btn">JSON Results</a>
                      <a href="benchmark_results.csv" class="btn data-btn">CSV Data</a>
                      <a href="benchmark_console.txt" class="btn">Console Output</a>
                  </div>
                  
                  <div class="card">
                      <h2>System Information</h2>
                      <p>Hardware and build environment details for performance context.</p>
                      <a href="system_info.txt" class="btn">System Info</a>
                  </div>
              </div>
              
              <div class="card">
                  <h2>Interactive Flame Graph</h2>
                  <p>Embedded flame graph showing function call patterns and CPU time distribution:</p>
                  <div id="flame-graph-embed">
                      <iframe src="flamegraph.svg" title="Performance Flame Graph" id="flame-iframe"></iframe>
                  </div>
              </div>
              
              <script>
                  document.getElementById('timestamp').textContent = new Date().toLocaleString();
                  
                  // Check if flame graph files exist and update UI accordingly
                  async function checkFlameGraphAvailability() {
                      try {
                          // Check for flamegraph.svg
                          const flameResponse = await fetch('flamegraph.svg');
                          if (!flameResponse.ok) {
                              throw new Error('Flame graph not available');
                          }
                          
                          // Flame graph is available
                          document.getElementById('flame-graph-status').innerHTML = 
                              '<div class="alert" style="background: #d4edda; border: 1px solid #c3e6cb; color: #155724;">✅ Flame graph generated successfully</div>';
                      } catch (error) {
                          // Flame graph not available, check for unavailable notice
                          try {
                              const unavailableResponse = await fetch('flamegraph_unavailable.txt');
                              if (unavailableResponse.ok) {
                                  const message = await unavailableResponse.text();
                                  document.getElementById('flame-graph-btn').classList.add('unavailable');
                                  document.getElementById('flame-graph-btn').textContent = 'Flame Graph Unavailable';
                                  document.getElementById('perf-data-btn').classList.add('unavailable');
                                  document.getElementById('flame-graph-status').innerHTML = 
                                      '<div class="alert alert-warning">⚠️ Flame graph generation failed: ' + message.split('.')[0] + '...</div>';
                                  document.getElementById('flame-graph-embed').innerHTML = 
                                      '<div class="alert alert-warning">Flame graph visualization is not available for this build. ' +
                                      'This can happen in containerized CI environments where perf tools have limited access.</div>';
                              }
                          } catch (e) {
                              document.getElementById('flame-graph-status').innerHTML = 
                                  '<div class="alert alert-warning">⚠️ Flame graph status unknown</div>';
                          }
                      }
                  }
                  
                  checkFlameGraphAvailability();
              </script>
          </body>
          </html>
          EOF

          # Create a basic README for docs if it doesn't exist
          if [ ! -f docs/README.md ]; then
            echo "# UTF Strings Documentation" > docs/README.md
            echo "This directory contains automated performance benchmark results and documentation." >> docs/README.md
          fi

      - name: Commit Performance Analysis Reports
        run: |
          # Add all generated performance files to git
          git add docs/performance/

          # Check if there are changes to commit
          if ! git diff --cached --quiet; then
            git commit -m "Update performance analysis reports

            - Detailed benchmark results (JSON, CSV, console)
            - Flame graph analysis (if available)
            - System information and build context
            - Generated on: $(date)
            - Build: Clang 18 Release with libc++"
            
            # Push the performance reports
            git push origin main
            
            echo "Performance reports committed and pushed successfully"
          else
            echo "No changes in performance reports to commit"
          fi

      - name: Store Performance Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "googlecpp"
          output-file-path: build/build/performance_baseline.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false
          # Use gh-pages branch for benchmark data storage
          gh-pages-branch: "gh-pages"
          benchmark-data-dir-path: "dev/bench"
