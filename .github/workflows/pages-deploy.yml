name: Deploy GitHub Pages

on:
  # Trigger on successful CI completion
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    branches: [main, master]
    types:
      - completed

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy to GitHub Pages"
    runs-on: ubuntu-latest

    # Only deploy if the CI workflow succeeded and we're on main/master
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || 
       github.event.workflow_run.head_branch == 'master')

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the docs artifact from the completed CI run
      - name: Download docs artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }},
            });

            const docsArtifact = artifacts.data.artifacts.find((artifact) => {
              return artifact.name === "docs-for-pages";
            });

            if (!docsArtifact) {
              throw new Error('No docs-for-pages artifact found');
            }

            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: docsArtifact.id,
              archive_format: 'zip',
            });

            const fs = require('fs');
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/docs.zip`, Buffer.from(download.data));

      - name: Extract docs artifact
        run: |
          # Remove any existing docs directory to avoid conflicts
          rm -rf docs/

          # Extract with overwrite flag to avoid prompts
          unzip -o docs.zip -d docs/
          ls -la docs/

      - name: Prepare Jekyll site for Pages deployment
        run: |
          # Clean up any build artifacts
          rm -rf docs/_site docs/.jekyll-cache docs/.sass-cache

          # Set proper permissions for Jekyll
          chmod -R 755 docs/
          find docs/ -type f -exec chmod 644 {} \;

          echo "=== Final verification ==="
          echo "✅ Contents of docs directory:"
          find docs/ -type f | sort
          echo ""
          echo "✅ Jekyll configuration:"
          if [ -f "docs/_config.yml" ]; then
            ls -la docs/_config.yml
            echo "Jekyll config file exists"
            echo "Theme: $(grep 'remote_theme\|theme:' docs/_config.yml || echo 'Default')"
          else
            echo "❌ ERROR: Jekyll config file is missing!"
            exit 1
          fi
          echo ""
          echo "✅ Required assets check:"
          if [ -f "docs/assets/css/style.scss" ]; then
            echo "CSS assets found"
          else
            echo "❌ WARNING: CSS assets missing"
          fi

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🎉 GitHub Pages deployment completed!"
          echo "📄 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "🎨 Jekyll processing: ENABLED with Primer theme"
          echo "📁 Built site deployed from docs/_site directory"
