name: Deploy GitHub Pages

on:
  # Trigger on successful CI completion OR performance baseline completion OR documentation
  workflow_run:
    workflows: ["CI/CD Pipeline", "Performance Baseline Tracking", "Documentation"]
    branches: [main, master]
    types:
      - completed

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy to GitHub Pages"
    runs-on: ubuntu-latest

    # Only deploy if the workflow succeeded and we're on main/master
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || 
       github.event.workflow_run.head_branch == 'master')

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup repository docs
        run: |
          # Save repository docs for fallback
          mkdir -p /tmp/repo-docs
          if [ -d "docs" ]; then
            cp -r docs/* /tmp/repo-docs/
            echo "✅ Repository docs backed up"
          else
            echo "❌ No docs directory in repository"
          fi

      # Download documentation artifacts from both CI and Performance workflows
      - name: Download and merge documentation artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Function to download artifact by name from a workflow run
            async function downloadArtifact(runId, artifactName, fileName) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });

              const artifact = artifacts.data.artifacts.find((artifact) => {
                return artifact.name === artifactName;
              });

              if (artifact) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                
                fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/${fileName}`, Buffer.from(download.data));
                console.log(`✅ Downloaded ${artifactName} from run ${runId}`);
                return true;
              }
              return false;
            }

            // Try to download docs from current workflow run
            const currentRunId = ${{ github.event.workflow_run.id }};
            let foundDocs = false;

            // Check what type of workflow triggered this deployment
            if ('${{ github.event.workflow_run.name }}' === 'CI/CD Pipeline') {
              foundDocs = await downloadArtifact(currentRunId, "docs-for-pages", "docs.zip");
            } else if ('${{ github.event.workflow_run.name }}' === 'Performance Baseline Tracking') {
              foundDocs = await downloadArtifact(currentRunId, "performance-docs-for-pages", "perf-docs.zip");
            } else if ('${{ github.event.workflow_run.name }}' === 'Documentation') {
              foundDocs = await downloadArtifact(currentRunId, "api-documentation", "api-docs.zip");
            }

            // If this is a CI run, also look for recent Performance Baseline artifacts
            if ('${{ github.event.workflow_run.name }}' === 'CI/CD Pipeline') {
              console.log('🔍 CI workflow triggered - looking for recent Performance Baseline artifacts...');
              
              // Get recent Performance Baseline workflow runs
              const workflowRuns = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'performance-baseline.yml',
                branch: 'main',
                status: 'completed',
                per_page: 5
              });
              
              // Find the most recent successful performance run
              const recentPerfRun = workflowRuns.data.workflow_runs.find(run => 
                run.conclusion === 'success' && 
                new Date(run.created_at) > new Date(Date.now() - 24 * 60 * 60 * 1000) // Within 24 hours
              );
              
              if (recentPerfRun) {
                console.log(`🎯 Found recent performance run: ${recentPerfRun.id}`);
                await downloadArtifact(recentPerfRun.id, "performance-docs-for-pages", "perf-docs.zip");
              }
            } else if ('${{ github.event.workflow_run.name }}' === 'Performance Baseline Tracking') {
              console.log('🔥 Performance Baseline workflow triggered - looking for CI docs...');
              
              // Get recent CI workflow runs for base documentation
              const workflowRuns = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                branch: 'main',
                status: 'completed',
                per_page: 5
              });
              
              const recentCIRun = workflowRuns.data.workflow_runs.find(run => 
                run.conclusion === 'success' &&
                new Date(run.created_at) > new Date(Date.now() - 24 * 60 * 60 * 1000) // Within 24 hours
              );
              
              if (recentCIRun) {
                console.log(`📋 Found recent CI run: ${recentCIRun.id}`);
                await downloadArtifact(recentCIRun.id, "docs-for-pages", "ci-docs.zip");
              }
            } else if ('${{ github.event.workflow_run.name }}' === 'Documentation') {
              console.log('📚 Documentation workflow triggered - looking for CI docs...');
              
              // Get recent CI workflow runs for base documentation
              const workflowRuns = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                branch: 'main',
                status: 'completed',
                per_page: 5
              });
              
              const recentCIRun = workflowRuns.data.workflow_runs.find(run => 
                run.conclusion === 'success' &&
                new Date(run.created_at) > new Date(Date.now() - 24 * 60 * 60 * 1000) // Within 24 hours
              );
              
              if (recentCIRun) {
                console.log(`📋 Found recent CI run: ${recentCIRun.id}`);
                await downloadArtifact(recentCIRun.id, "docs-for-pages", "ci-docs.zip");
              }
            }

            if (!foundDocs) {
              console.log('⚠️  No primary documentation artifact found in current run');
              console.log('Will try to use repository documentation as fallback');
            }

      - name: Extract and merge documentation artifacts
        run: |
          # Remove any existing docs directory to avoid conflicts
          rm -rf docs/
          
          echo "🔧 Extracting documentation artifacts..."
          
          # Create base docs structure from repository
          mkdir -p docs/performance docs/api
          
          # Copy base documentation from repository
          cp -r /tmp/repo-docs/* docs/ 2>/dev/null || echo "No base docs found in repo"
          
          # Extract CI docs first (base documentation)
          if [ -f "docs.zip" ]; then
            echo "📋 Extracting CI documentation..."
            unzip -o docs.zip -d temp-docs/
            # Merge with existing docs, preserving performance files
            rsync -a temp-docs/ docs/
            rm -rf temp-docs/
            echo "✅ CI docs extracted"
          elif [ -f "ci-docs.zip" ]; then
            echo "📋 Extracting CI documentation from separate artifact..."
            unzip -o ci-docs.zip -d temp-docs/
            rsync -a temp-docs/ docs/
            rm -rf temp-docs/
            echo "✅ CI docs extracted"
          fi
          
          # Extract performance docs second (will overlay/merge with CI docs)
          if [ -f "perf-docs.zip" ]; then
            echo "🔥 Extracting performance documentation..."
            unzip -o perf-docs.zip -d temp-perf/
            # Merge performance files specifically
            if [ -d "temp-perf/performance" ]; then
              rsync -a temp-perf/performance/ docs/performance/
            fi
            rm -rf temp-perf/
            echo "✅ Performance docs extracted and merged"
          fi
          
          # Extract API documentation third (will overlay/merge with existing docs)
          if [ -f "api-docs.zip" ]; then
            echo "📚 Extracting API documentation..."
            unzip -o api-docs.zip -d temp-api/
            # The artifact contains docs/api/ structure, so extract into docs/
            if [ -d "temp-api/docs/api" ]; then
              echo "Found docs/api structure in artifact"
              rsync -a temp-api/docs/api/ docs/api/
            elif [ -d "temp-api/api" ]; then
              echo "Found api/ structure in artifact"
              rsync -a temp-api/api/ docs/api/
            else
              # Fallback: copy everything to api directory
              echo "⚠️  Unexpected artifact structure - using fallback"
              echo "Artifact contents:"
              find temp-api/ -type d | head -10
              rsync -a temp-api/ docs/api/
            fi
            rm -rf temp-api/
            echo "✅ API docs extracted and merged"
          fi
          
          # Ensure performance directory exists with minimum required files
          mkdir -p docs/performance
          if [ ! -f "docs/performance/index.html" ]; then
            # Fallback: copy from repository if artifact doesn't have it
            if [ -f "/tmp/repo-docs/performance/index.html" ]; then
              cp /tmp/repo-docs/performance/index.html docs/performance/
            fi
          fi
          
          echo ""
          echo "📁 Final merged documentation structure:"
          find docs/ -type f | sort
          
          echo ""
          echo "🔍 Performance files check:"
          ls -la docs/performance/ 2>/dev/null || echo "❌ No performance directory found"
          
          echo ""
          echo "🔍 API docs check:"
          ls -la docs/api/ 2>/dev/null || echo "❌ No API directory found"

      - name: Prepare Jekyll site for Pages deployment
        run: |
          # Clean up any build artifacts
          rm -rf docs/_site docs/.jekyll-cache docs/.sass-cache

          # Set proper permissions for Jekyll
          chmod -R 755 docs/
          find docs/ -type f -exec chmod 644 {} \;

          echo "=== Final verification ==="
          echo "✅ Contents of docs directory:"
          find docs/ -type f | sort
          echo ""
          echo "✅ Jekyll configuration:"
          if [ -f "docs/_config.yml" ]; then
            ls -la docs/_config.yml
            echo "Jekyll config file exists"
            echo "Theme: $(grep 'remote_theme\|theme:' docs/_config.yml || echo 'Default')"
          else
            echo "❌ ERROR: Jekyll config file is missing!"
            exit 1
          fi
          echo ""
          echo "✅ Required assets check:"
          if [ -f "docs/assets/css/style.scss" ]; then
            echo "CSS assets found"
          else
            echo "❌ WARNING: CSS assets missing"
          fi

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🎉 GitHub Pages deployment completed!"
          echo "📄 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "🎨 Jekyll processing: ENABLED with Primer theme"
          echo "📁 Built site deployed from docs/_site directory"
