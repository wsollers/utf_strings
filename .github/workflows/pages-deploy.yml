name: Deploy GitHub Pages

on:
  # Trigger on successful CI completion
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    branches: [main, master]
    types:
      - completed

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    
    # Only deploy if the CI workflow succeeded and we're on main/master
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || 
       github.event.workflow_run.head_branch == 'master')
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the docs artifact from the completed CI run
      - name: Download docs artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }},
            });
            
            const docsArtifact = artifacts.data.artifacts.find((artifact) => {
              return artifact.name === "docs-for-pages";
            });
            
            if (!docsArtifact) {
              throw new Error('No docs-for-pages artifact found');
            }
            
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: docsArtifact.id,
              archive_format: 'zip',
            });
            
            const fs = require('fs');
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/docs.zip`, Buffer.from(download.data));

      - name: Extract docs artifact
        run: |
          unzip docs.zip -d docs/
          ls -la docs/

      - name: Prepare static site for Pages deployment
        run: |
          # Create .nojekyll file to explicitly disable Jekyll processing
          touch docs/.nojekyll
          
          # Remove any Jekyll-related files that might cause conflicts
          rm -f docs/_config.yml docs/Gemfile docs/Gemfile.lock
          rm -rf docs/_site docs/.jekyll-cache docs/.sass-cache
          
          # Remove any underscore-prefixed files/directories that Jekyll might interpret
          find docs/ -name "_*" -type d -exec rm -rf {} + 2>/dev/null || true
          find docs/ -name "_*" -type f ! -name ".nojekyll" -delete 2>/dev/null || true
          
          # Set proper permissions
          chmod -R 755 docs/
          chmod 644 docs/.nojekyll
          
          echo "=== Final verification ==="
          echo "✅ Contents of docs directory:"
          find docs/ -type f | sort
          echo ""
          echo "✅ .nojekyll file:"
          if [ -f "docs/.nojekyll" ]; then
            ls -la docs/.nojekyll
            echo "File exists and is properly configured"
          else
            echo "❌ ERROR: .nojekyll file is missing!"
            exit 1
          fi
          echo ""
          echo "✅ Jekyll conflict check:"
          if find docs/ -name "_config.yml" -o -name "Gemfile*" -o -name "_*" | grep -v ".nojekyll" | grep -q .; then
            echo "❌ WARNING: Found potential Jekyll files:"
            find docs/ -name "_config.yml" -o -name "Gemfile*" -o -name "_*" | grep -v ".nojekyll"
          else
            echo "No Jekyll conflicts found"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Ensure we don't use Jekyll
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment summary
        run: |
          echo "🎉 GitHub Pages deployment completed!"
          echo "📄 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "🚫 Jekyll processing: DISABLED via .nojekyll"
          echo "📁 Static files deployed from docs/ directory"