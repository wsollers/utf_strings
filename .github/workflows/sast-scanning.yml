name: "SAST Security Scanning"

# Comprehensive Static Application Security Testing (SAST) workflow
# Includes: Trivy, Checkov, Gitleaks, Cppcheck, and Semgrep
# All tools run directly in this workflow - no external dependencies required
#
# SARIF Results uploaded to Security/Code Scanning tab:
# - trivy-security: Vulnerability & misconfiguration scanning
# - checkov-infrastructure: Infrastructure as Code security
# - gitleaks-secrets: Secret detection in git history
# - cppcheck-static-analysis: C/C++ static code analysis
# - semgrep-security: Security pattern matching & code analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run comprehensive SAST scan daily at 4 AM UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      scan_intensity:
        description: "SAST scanning intensity level"
        required: false
        default: "comprehensive"
        type: choice
        options:
          - basic
          - comprehensive
          - deep

jobs:
  # ============================================================================
  # Trivy Security Scanner
  # ============================================================================

  trivy-scan:
    name: "Trivy Security Scan"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"
          # Scan for vulnerabilities in filesystem, dependencies, and misconfigurations
          scanners: "vuln,secret,misconfig"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-security

      - name: Generate Trivy report summary
        run: |
          echo "# Trivy Security Scan Results" > trivy-summary.md
          echo "**Scan Date:** $(date)" >> trivy-summary.md
          echo "**Repository:** ${{ github.repository }}" >> trivy-summary.md
          echo "**Commit:** ${{ github.sha }}" >> trivy-summary.md
          echo "" >> trivy-summary.md

          # Run Trivy in table format for summary
          echo "## Summary Report" >> trivy-summary.md
          echo "\`\`\`" >> trivy-summary.md
          trivy fs --format table --severity CRITICAL,HIGH,MEDIUM . >> trivy-summary.md || echo "No critical/high/medium issues found" >> trivy-summary.md
          echo "\`\`\`" >> trivy-summary.md

      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results-${{ github.run_number }}
          path: |
            trivy-results.sarif
            trivy-summary.md
          retention-days: 30

  # ============================================================================
  # Checkov Infrastructure Security Scanner
  # ============================================================================

  checkov-scan:
    name: "Checkov Infrastructure Scan"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python for Checkov
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: |
          pip install checkov

      - name: Run Checkov scan
        run: |
          # Run Checkov on infrastructure files (GitHub Actions, Docker, etc.)
          echo "Running Checkov infrastructure security scan..."

          checkov \
            --directory . \
            --framework github_actions,dockerfile,yaml,json \
            --output sarif \
            --output-file-path checkov-results.sarif \
            --soft-fail \
            --quiet || echo "Checkov scan completed with findings"

          # Also generate human-readable output
          checkov \
            --directory . \
            --framework github_actions,dockerfile,yaml,json \
            --output cli \
            --quiet > checkov-report.txt || echo "Checkov CLI report completed"

      - name: Generate Checkov summary
        run: |
          echo "# Checkov Infrastructure Security Scan" > checkov-summary.md
          echo "**Scan Date:** $(date)" >> checkov-summary.md
          echo "**Frameworks:** GitHub Actions, Docker, YAML, JSON" >> checkov-summary.md
          echo "" >> checkov-summary.md

          if [ -f "checkov-results.sarif" ]; then
            # Count findings from SARIF if available
            FINDINGS_COUNT=$(jq '.runs[0].results | length' checkov-results.sarif 2>/dev/null || echo "0")
            echo "**Total Findings:** $FINDINGS_COUNT" >> checkov-summary.md
            
            if [ "$FINDINGS_COUNT" -eq 0 ]; then
              echo "✅ **No infrastructure security issues found!**" >> checkov-summary.md
            else
              echo "⚠️ **Infrastructure security issues detected**" >> checkov-summary.md
            fi
          else
            echo "ℹ️ **Scan completed - check artifacts for details**" >> checkov-summary.md
          fi

          echo "" >> checkov-summary.md
          echo "## Report Summary" >> checkov-summary.md
          if [ -f "checkov-report.txt" ]; then
            echo "\`\`\`" >> checkov-summary.md
            head -50 checkov-report.txt >> checkov-summary.md || echo "No detailed report available" >> checkov-summary.md
            echo "\`\`\`" >> checkov-summary.md
          fi

      - name: Upload Checkov scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('checkov-results.sarif') != ''
        with:
          sarif_file: checkov-results.sarif
          category: checkov-infrastructure

      - name: Upload Checkov artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-scan-results-${{ github.run_number }}
          path: |
            checkov-results.sarif
            checkov-report.txt
            checkov-summary.md
          retention-days: 30

  # ============================================================================
  # Gitleaks Secret Scanner
  # ============================================================================

  gitleaks-scan:
    name: "Gitleaks Secret Scan"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for comprehensive secret scanning

      - name: Validate Gitleaks configuration
        run: |
          if [ -f ".gitleaks.toml" ]; then
            echo "✅ Gitleaks configuration file exists"
            echo "📋 Configuration preview:"
            head -20 .gitleaks.toml
          else
            echo "ℹ️  No custom Gitleaks configuration found, using defaults"
          fi

      - name: Run Gitleaks scan
        id: gitleaks-scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}} # Optional: for Gitleaks Pro features
        with:
          config-path: .gitleaks.toml # Optional: custom config file

      - name: Fallback Gitleaks scan (if action failed)
        if: steps.gitleaks-scan.outcome == 'failure'
        run: |
          echo "⚠️ Gitleaks action failed, running manual scan..."

          # Install Gitleaks manually
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          chmod +x gitleaks

          # Run scan with minimal configuration
          ./gitleaks detect --redact --exit-code=0 --report-format=sarif --report-path=results.sarif --no-git || echo "Gitleaks scan completed"

          # Verify results file exists
          if [ -f "results.sarif" ]; then
            echo "✅ Gitleaks SARIF results generated successfully"
          else
            echo "⚠️ No SARIF results generated, creating empty results"
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"gitleaks"}},"results":[]}]}' > results.sarif
          fi

      - name: Upload Gitleaks scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: gitleaks-secrets

      - name: Generate Gitleaks summary
        if: always()
        run: |
          echo "# Gitleaks Secret Scanning Results" > gitleaks-summary.md
          echo "**Scan Date:** $(date)" >> gitleaks-summary.md
          echo "**Repository:** ${{ github.repository }}" >> gitleaks-summary.md
          echo "**Scan Type:** Full history secret detection" >> gitleaks-summary.md

          # Check scan status
          if [ "${{ steps.gitleaks-scan.outcome }}" = "failure" ]; then
            echo "**Scan Status:** ⚠️ Primary scan failed, fallback scan used" >> gitleaks-summary.md
          else
            echo "**Scan Status:** ✅ Primary scan completed successfully" >> gitleaks-summary.md
          fi
          echo "" >> gitleaks-summary.md

          if [ -f "results.sarif" ]; then
            # Validate SARIF file first
            if jq empty results.sarif 2>/dev/null; then
              SECRETS_COUNT=$(jq '.runs[0].results | length' results.sarif 2>/dev/null || echo "0")
              echo "**Secrets Found:** $SECRETS_COUNT" >> gitleaks-summary.md
              
              if [ "$SECRETS_COUNT" -eq 0 ]; then
                echo "✅ **No secrets detected in repository history!**" >> gitleaks-summary.md
              else
                echo "🚨 **CRITICAL: Secrets detected in repository history**" >> gitleaks-summary.md
                echo "" >> gitleaks-summary.md
                echo "**Immediate Action Required:**" >> gitleaks-summary.md
                echo "1. Review detected secrets immediately" >> gitleaks-summary.md
                echo "2. Rotate any exposed credentials" >> gitleaks-summary.md
                echo "3. Remove secrets from git history if needed" >> gitleaks-summary.md
              fi
            else
              echo "⚠️ **Invalid SARIF file generated - manual review required**" >> gitleaks-summary.md
            fi
          else
            echo "⚠️ **No SARIF results generated - scan may have failed**" >> gitleaks-summary.md
            echo "" >> gitleaks-summary.md
            echo "**Recommended Actions:**" >> gitleaks-summary.md
            echo "1. Check workflow logs for errors" >> gitleaks-summary.md
            echo "2. Verify .gitleaks.toml configuration" >> gitleaks-summary.md
            echo "3. Run manual gitleaks scan locally" >> gitleaks-summary.md
          fi

      - name: Upload Gitleaks artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-scan-results-${{ github.run_number }}
          path: |
            results.sarif
            gitleaks-summary.md
          retention-days: 90 # Keep secret scan results longer for security compliance

  # ============================================================================
  # Cppcheck Static Analysis
  # ============================================================================

  cppcheck-scan:
    name: "Cppcheck Static Analysis"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

          # Python3 is pre-installed on ubuntu-24.04
          python3 --version

      - name: Set severity level based on scan intensity
        id: set-severity
        run: |
          SCAN_INTENSITY="${{ github.event.inputs.scan_intensity || 'comprehensive' }}"
          if [ "$SCAN_INTENSITY" = "deep" ]; then
            echo "severity=all" >> $GITHUB_OUTPUT
            echo "enable_checks=all" >> $GITHUB_OUTPUT
          elif [ "$SCAN_INTENSITY" = "comprehensive" ]; then
            echo "severity=warning,error" >> $GITHUB_OUTPUT
            echo "enable_checks=warning,performance,portability,information,missingInclude" >> $GITHUB_OUTPUT
          else
            echo "severity=error" >> $GITHUB_OUTPUT
            echo "enable_checks=error" >> $GITHUB_OUTPUT
          fi

      - name: Run Cppcheck analysis
        run: |
          echo "Running Cppcheck with severity: ${{ steps.set-severity.outputs.severity }}"
          echo "Enabled checks: ${{ steps.set-severity.outputs.enable_checks }}"

          # Run Cppcheck and generate XML output
          cppcheck \
            --enable=${{ steps.set-severity.outputs.enable_checks }} \
            --inconclusive \
            --std=c++17 \
            --platform=unix64 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --inline-suppr \
            --error-exitcode=0 \
            --xml \
            --xml-version=2 \
            --output-file=cppcheck-results.xml \
            src/ include/ 2>&1 || echo "Cppcheck analysis completed"

          # Convert XML to SARIF format using custom Python script
          if [ -f "cppcheck-results.xml" ]; then
            echo "Converting Cppcheck XML results to SARIF format..."
            
            # Create a simple XML to SARIF converter
            python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import json
          import sys
          import os

          def convert_cppcheck_xml_to_sarif(xml_file, sarif_file):
              try:
                  # Parse XML file
                  tree = ET.parse(xml_file)
                  root = tree.getroot()
                  
                  # Initialize SARIF structure
                  sarif = {
                      "version": "2.1.0",
                      "$schema": "https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0.json",
                      "runs": [{
                          "tool": {
                              "driver": {
                                  "name": "Cppcheck",
                                  "informationUri": "https://cppcheck.sourceforge.io/",
                                  "version": "2.13.0",
                                  "rules": []
                              }
                          },
                          "results": []
                      }]
                  }
                  
                  rules = {}
                  results = []
                  
                  # Process errors
                  for error in root.findall('.//error'):
                      error_id = error.get('id', 'unknown')
                      severity = error.get('severity', 'info')
                      msg = error.get('msg', 'No message')
                      
                      # Map Cppcheck severity to SARIF level
                      level_map = {
                          'error': 'error',
                          'warning': 'warning', 
                          'style': 'note',
                          'performance': 'note',
                          'portability': 'note',
                          'information': 'note'
                      }
                      level = level_map.get(severity, 'note')
                      
                      # Add rule if not seen before
                      if error_id not in rules:
                          rules[error_id] = {
                              "id": error_id,
                              "shortDescription": {"text": f"Cppcheck {severity}: {error_id}"},
                              "fullDescription": {"text": msg},
                              "defaultConfiguration": {"level": level}
                          }
                      
                      # Process locations
                      locations = []
                      for location in error.findall('location'):
                          file_path = location.get('file', '')
                          line = int(location.get('line', '1'))
                          
                          # Strip workspace prefix for cleaner paths
                          if file_path.startswith('/'):
                              rel_path = os.path.relpath(file_path, os.getcwd())
                              if not rel_path.startswith('..'):
                                  file_path = rel_path
                          
                          locations.append({
                              "physicalLocation": {
                                  "artifactLocation": {"uri": file_path},
                                  "region": {"startLine": line}
                              }
                          })
                      
                      # Create result
                      result = {
                          "ruleId": error_id,
                          "level": level,
                          "message": {"text": msg},
                          "locations": locations if locations else [{
                              "physicalLocation": {
                                  "artifactLocation": {"uri": "unknown"},
                                  "region": {"startLine": 1}
                              }
                          }]
                      }
                      results.append(result)
                  
                  # Add rules and results to SARIF
                  sarif["runs"][0]["tool"]["driver"]["rules"] = list(rules.values())
                  sarif["runs"][0]["results"] = results
                  
                  # Write SARIF file
                  with open(sarif_file, 'w') as f:
                      json.dump(sarif, f, indent=2)
                  
                  print(f"✅ Converted {len(results)} findings to SARIF format")
                  return True
                  
              except Exception as e:
                  print(f"❌ SARIF conversion failed: {e}")
                  # Create empty SARIF file
                  empty_sarif = {
                      "version": "2.1.0",
                      "runs": [{"tool": {"driver": {"name": "Cppcheck"}}, "results": []}]
                  }
                  with open(sarif_file, 'w') as f:
                      json.dump(empty_sarif, f)
                  return False

          # Convert the file
          convert_cppcheck_xml_to_sarif('cppcheck-results.xml', 'cppcheck-results.sarif')
          EOF
            
            echo "Cppcheck analysis completed. Results saved to XML and SARIF formats."
          else
            echo "No Cppcheck results file generated"
            # Create empty SARIF file for consistency
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Cppcheck"}},"results":[]}]}' > cppcheck-results.sarif
          fi

      - name: Generate Cppcheck summary
        run: |
          echo "# Cppcheck Static Analysis Results" > cppcheck-summary.md
          echo "**Analysis Date:** $(date)" >> cppcheck-summary.md
          echo "**Severity Level:** ${{ steps.set-severity.outputs.severity }}" >> cppcheck-summary.md
          echo "**Enabled Checks:** ${{ steps.set-severity.outputs.enable_checks }}" >> cppcheck-summary.md
          echo "" >> cppcheck-summary.md

          if [ -f "cppcheck-results.xml" ]; then
            # Count issues from XML with proper validation
            ERROR_COUNT=$(grep -c "severity=\"error\"" cppcheck-results.xml 2>/dev/null || echo "0")
            WARNING_COUNT=$(grep -c "severity=\"warning\"" cppcheck-results.xml 2>/dev/null || echo "0")
            STYLE_COUNT=$(grep -c "severity=\"style\"" cppcheck-results.xml 2>/dev/null || echo "0")
            
            # Validate that all counts are numeric (fallback to 0 if empty or invalid)
            ERROR_COUNT=${ERROR_COUNT:-0}
            WARNING_COUNT=${WARNING_COUNT:-0}
            STYLE_COUNT=${STYLE_COUNT:-0}
            
            # Ensure they are integers
            if ! [[ "$ERROR_COUNT" =~ ^[0-9]+$ ]]; then ERROR_COUNT=0; fi
            if ! [[ "$WARNING_COUNT" =~ ^[0-9]+$ ]]; then WARNING_COUNT=0; fi
            if ! [[ "$STYLE_COUNT" =~ ^[0-9]+$ ]]; then STYLE_COUNT=0; fi
            
            echo "**Issues Found:**" >> cppcheck-summary.md
            echo "- Errors: $ERROR_COUNT" >> cppcheck-summary.md
            echo "- Warnings: $WARNING_COUNT" >> cppcheck-summary.md
            echo "- Style Issues: $STYLE_COUNT" >> cppcheck-summary.md
            echo "" >> cppcheck-summary.md

            TOTAL_ISSUES=$((ERROR_COUNT + WARNING_COUNT + STYLE_COUNT))
            if [ "$TOTAL_ISSUES" -eq 0 ]; then
              echo "✅ **No static analysis issues found!**" >> cppcheck-summary.md
            else
              echo "⚠️ **$TOTAL_ISSUES static analysis issue(s) detected**" >> cppcheck-summary.md
            fi

            # Add sample of issues if any
            if [ "$TOTAL_ISSUES" -gt 0 ]; then
              echo "" >> cppcheck-summary.md
              echo "## Sample Issues" >> cppcheck-summary.md
              echo "\`\`\`xml" >> cppcheck-summary.md
              head -20 cppcheck-results.xml >> cppcheck-summary.md || echo "No detailed results available" >> cppcheck-summary.md
              echo "\`\`\`" >> cppcheck-summary.md
            fi
          else
            echo "ℹ️ **No Cppcheck results file generated**" >> cppcheck-summary.md
          fi

      - name: Upload Cppcheck SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('cppcheck-results.sarif') != ''
        with:
          sarif_file: cppcheck-results.sarif
          category: cppcheck-static-analysis

      - name: Upload Cppcheck artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-analysis-results-${{ github.run_number }}
          path: |
            cppcheck-results.xml
            cppcheck-results.sarif
            cppcheck-summary.md
          retention-days: 30

  # ============================================================================
  # Semgrep Security Analysis
  # ============================================================================

  semgrep-scan:
    name: "Semgrep Security Analysis"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Semgrep ruleset based on scan intensity
        id: set-ruleset
        run: |
          SCAN_INTENSITY="${{ github.event.inputs.scan_intensity || 'comprehensive' }}"
          if [ "$SCAN_INTENSITY" = "deep" ]; then
            echo "ruleset=auto" >> $GITHUB_OUTPUT
            echo "config=auto" >> $GITHUB_OUTPUT
          elif [ "$SCAN_INTENSITY" = "comprehensive" ]; then
            echo "ruleset=r/c.lang.security,r/cpp" >> $GITHUB_OUTPUT
            echo "config=r/c.lang.security r/cpp" >> $GITHUB_OUTPUT
          else
            echo "ruleset=r/c.lang.security" >> $GITHUB_OUTPUT
            echo "config=r/c.lang.security" >> $GITHUB_OUTPUT
          fi

      - name: Run Semgrep security analysis
        uses: semgrep/semgrep-action@v1
        with:
          config: ${{ steps.set-ruleset.outputs.config }}
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep-security

      - name: Generate Semgrep summary
        if: always()
        run: |
          echo "# Semgrep Security Analysis Results" > semgrep-summary.md
          echo "**Analysis Date:** $(date)" >> semgrep-summary.md
          echo "**Ruleset:** ${{ steps.set-ruleset.outputs.ruleset }}" >> semgrep-summary.md
          echo "**Scan Intensity:** ${{ github.event.inputs.scan_intensity || 'comprehensive' }}" >> semgrep-summary.md
          echo "" >> semgrep-summary.md

          if [ -f "semgrep.sarif" ]; then
            # Count findings from SARIF
            FINDINGS_COUNT=$(jq '.runs[0].results | length' semgrep.sarif 2>/dev/null || echo "0")
            echo "**Security Findings:** $FINDINGS_COUNT" >> semgrep-summary.md
            
            if [ "$FINDINGS_COUNT" -eq 0 ]; then
              echo "✅ **No security issues detected!**" >> semgrep-summary.md
            else
              echo "⚠️ **$FINDINGS_COUNT security issue(s) detected**" >> semgrep-summary.md
              
              # Try to categorize findings by severity
              HIGH_COUNT=$(jq '[.runs[0].results[] | select(.level == "error")] | length' semgrep.sarif 2>/dev/null || echo "0")
              MEDIUM_COUNT=$(jq '[.runs[0].results[] | select(.level == "warning")] | length' semgrep.sarif 2>/dev/null || echo "0")
              LOW_COUNT=$(jq '[.runs[0].results[] | select(.level == "note" or .level == "info")] | length' semgrep.sarif 2>/dev/null || echo "0")
              
              echo "" >> semgrep-summary.md
              echo "**Severity Breakdown:**" >> semgrep-summary.md
              echo "- High: $HIGH_COUNT" >> semgrep-summary.md
              echo "- Medium: $MEDIUM_COUNT" >> semgrep-summary.md  
              echo "- Low/Info: $LOW_COUNT" >> semgrep-summary.md
            fi
          else
            echo "ℹ️ **Semgrep analysis completed - check artifacts for details**" >> semgrep-summary.md
          fi

      - name: Upload Semgrep artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-analysis-results-${{ github.run_number }}
          path: |
            semgrep.sarif
            semgrep-summary.md
          retention-days: 30

  # ============================================================================
  # SAST Summary and Reporting
  # ============================================================================

  sast-summary:
    name: "SAST Summary Report"
    runs-on: ubuntu-24.04
    needs:
      [trivy-scan, checkov-scan, gitleaks-scan, cppcheck-scan, semgrep-scan]
    if: always()
    permissions:
      contents: read
      security-events: write
      actions: read
      issues: write
      pull-requests: write

    steps:
      - name: Download all SAST artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results-${{ github.run_number }}"
          merge-multiple: true

      - name: Generate comprehensive SAST report
        run: |
          echo "# Comprehensive SAST Security Analysis Report" > sast-comprehensive-report.md
          echo "" >> sast-comprehensive-report.md
          echo "**Analysis Date:** $(date)" >> sast-comprehensive-report.md
          echo "**Repository:** ${{ github.repository }}" >> sast-comprehensive-report.md
          echo "**Commit:** ${{ github.sha }}" >> sast-comprehensive-report.md
          echo "**Scan Intensity:** ${{ github.event.inputs.scan_intensity || 'comprehensive' }}" >> sast-comprehensive-report.md
          echo "" >> sast-comprehensive-report.md

          echo "## Security Tools Summary" >> sast-comprehensive-report.md
          echo "" >> sast-comprehensive-report.md

          # Trivy Summary
          echo "### 🛡️ Trivy (Vulnerability & Misconfiguration)" >> sast-comprehensive-report.md
          if [ -f "trivy-summary.md" ]; then
            tail -n +5 trivy-summary.md >> sast-comprehensive-report.md
          else
            echo "⚠️ Trivy results not available" >> sast-comprehensive-report.md
          fi
          echo "" >> sast-comprehensive-report.md

          # Checkov Summary  
          echo "### 🏗️ Checkov (Infrastructure Security)" >> sast-comprehensive-report.md
          if [ -f "checkov-summary.md" ]; then
            tail -n +5 checkov-summary.md >> sast-comprehensive-report.md
          else
            echo "⚠️ Checkov results not available" >> sast-comprehensive-report.md
          fi
          echo "" >> sast-comprehensive-report.md

          # Gitleaks Summary
          echo "### 🔐 Gitleaks (Secret Detection)" >> sast-comprehensive-report.md
          if [ -f "gitleaks-summary.md" ]; then
            tail -n +5 gitleaks-summary.md >> sast-comprehensive-report.md
          else
            echo "⚠️ Gitleaks results not available" >> sast-comprehensive-report.md
          fi
          echo "" >> sast-comprehensive-report.md

          # Cppcheck Summary
          echo "### 🔧 Cppcheck (Static Code Analysis)" >> sast-comprehensive-report.md
          if [ -f "cppcheck-summary.md" ]; then
            tail -n +5 cppcheck-summary.md >> sast-comprehensive-report.md
          else
            echo "⚠️ Cppcheck results not available" >> sast-comprehensive-report.md
          fi
          echo "" >> sast-comprehensive-report.md

          # Semgrep Summary
          echo "### 🔍 Semgrep (Security Pattern Analysis)" >> sast-comprehensive-report.md
          if [ -f "semgrep-summary.md" ]; then
            tail -n +5 semgrep-summary.md >> sast-comprehensive-report.md
          else
            echo "⚠️ Semgrep results not available" >> sast-comprehensive-report.md
          fi
          echo "" >> sast-comprehensive-report.md

          echo "## Next Steps" >> sast-comprehensive-report.md
          echo "1. Review all findings in the GitHub Security tab" >> sast-comprehensive-report.md
          echo "2. Prioritize critical and high severity issues" >> sast-comprehensive-report.md
          echo "3. Download detailed reports from workflow artifacts" >> sast-comprehensive-report.md
          echo "4. Implement fixes and re-run security scans" >> sast-comprehensive-report.md
          echo "5. Consider adjusting scan intensity for different scenarios" >> sast-comprehensive-report.md

          # Display the comprehensive report
          echo "=== Comprehensive SAST Security Report ==="
          cat sast-comprehensive-report.md

      - name: Upload comprehensive SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-comprehensive-report-${{ github.run_number }}
          path: sast-comprehensive-report.md
          retention-days: 90

      - name: Comment on PR with SAST results (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const report = fs.readFileSync('sast-comprehensive-report.md', 'utf8');
              
              const comment = `## 🛡️ Comprehensive SAST Security Analysis
              
              ${report}
              
              <details>
              <summary>🔍 View scan configuration</summary>
              
              **Tools Used:**
              - **Trivy:** Vulnerability and misconfiguration scanning
              - **Checkov:** Infrastructure security analysis  
              - **Gitleaks:** Secret detection in git history
              - **Cppcheck:** Static code analysis for C/C++
              - **Semgrep:** Security pattern matching and code analysis
              
              **SARIF Results:** All findings are automatically uploaded to the [Security/Code Scanning tab](https://github.com/${{ github.repository }}/security/code-scanning) for detailed analysis and tracking.
              
              **Scan Intensity:** \`${{ github.event.inputs.scan_intensity || 'comprehensive' }}\`
              
              **Workflow Run:** [View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              
              </details>`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not post PR comment:', error);
            }

      - name: Create security issue for critical findings (scheduled runs only)
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              // Check for critical findings across all tools
              let criticalCount = 0;
              let findings = [];
              
              // Check Trivy SARIF
              try {
                const trivySarif = JSON.parse(require('fs').readFileSync('trivy-results.sarif', 'utf8'));
                const trivyCritical = trivySarif.runs?.[0]?.results?.filter(r => 
                  r.level === 'error' || r.ruleId?.includes('CRITICAL')
                ) || [];
                criticalCount += trivyCritical.length;
                if (trivyCritical.length > 0) findings.push(`Trivy: ${trivyCritical.length} critical`);
              } catch (e) { console.log('No Trivy SARIF results'); }
              
              // Check Gitleaks SARIF  
              try {
                const gitleaksSarif = JSON.parse(require('fs').readFileSync('results.sarif', 'utf8'));
                const secretCount = gitleaksSarif.runs?.[0]?.results?.length || 0;
                criticalCount += secretCount;
                if (secretCount > 0) findings.push(`Gitleaks: ${secretCount} secrets`);
              } catch (e) { console.log('No Gitleaks SARIF results'); }
              
              if (criticalCount > 0) {
                const report = require('fs').readFileSync('sast-comprehensive-report.md', 'utf8');
                
                const issueTitle = `🚨 Critical Security Issues Detected - SAST Scan ${new Date().toISOString().split('T')[0]}`;
                const issueBody = `## Critical SAST Security Findings
                
                The daily SAST security scan has detected **${criticalCount}** critical security issue(s).
                
                ### Critical Findings:
                ${findings.map(f => `- ${f}`).join('\n')}
                
                ${report}
                
                ### 🚨 IMMEDIATE ACTION REQUIRED:
                1. **Review all critical findings immediately**  
                2. **Rotate any exposed secrets/credentials**
                3. **Patch critical vulnerabilities**
                4. **Fix infrastructure misconfigurations**
                5. **Re-run security scans after fixes**
                
                **Workflow Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
                `;
                
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  body: issueBody,
                  labels: ['security', 'critical', 'sast', 'immediate-action-required']
                });
              }
            } catch (error) {
              console.log('Could not create critical security issue:', error);
            }
