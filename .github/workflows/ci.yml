
name: ci
on:
  push:
  pull_request:

jobs:
  build-test-bench:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: conan-io/conan-action@v1

      - name: Conan install
        run: |
          conan install . -s build_type=${{ matrix.build_type }} --output-folder=build --build=missing

      - name: Configure (CMake)
        run: |
          cmake -S . -B build/${{ matrix.build_type }}             -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake             -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build (CMake)
        run: cmake --build build/${{ matrix.build_type }} --config ${{ matrix.build_type }} -- -j 2

      - name: Test (ctest)
        run: |
          ctest --test-dir build/${{ matrix.build_type }} -C ${{ matrix.build_type }} --output-on-failure

      - name: Benchmark (Release only)
        if: matrix.build_type == 'Release'
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/Release/utf_strings-bench.exe --benchmark_min_time=0.05
          else
            ./build/Release/utf_strings-bench --benchmark_min_time=0.05
          fi
        shell: bash
