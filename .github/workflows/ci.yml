    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Conan
      run: |
        pip3 install --user conan
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
    - name: Setup Conan profile
