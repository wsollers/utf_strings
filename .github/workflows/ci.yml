name: ci
on:
  push:
  pull_request:

jobs:
  build-test-bench:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: conan-io/conan-action@v1
      - name: Install deps
        run: conan install . -s build_type=${{ matrix.build_type }} --output-folder=build --build=missing
      - name: Generate build files
        run: |
          cd build
          if [[ "$RUNNER_OS" == "Windows" ]]; then premake5 vs2022; else premake5 gmake2; fi
        shell: bash
      - name: Build
        run: |
          cd build
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            MSBuild.exe utf_strings.sln -p:Configuration=${{ matrix.build_type }}
          else
            if [[ "${{ matrix.build_type }}" == "Debug" ]]; then make config=debug; else make config=release; fi
          fi
        shell: bash
      - name: Run unit tests
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/bin/${{ matrix.build_type }}/utf_strings-tests.exe
          else
            ./build/bin/${{ matrix.build_type }}/utf_strings-tests
          fi
        shell: bash
      - name: Run benchmark (Release only)
        if: matrix.build_type == 'Release'
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/bin/Release/utf_strings-bench.exe --benchmark_min_time=0.05
          else
            ./build/bin/Release/utf_strings-bench --benchmark_min_time=0.05
          fi
        shell: bash
