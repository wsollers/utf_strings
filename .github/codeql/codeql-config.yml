# CodeQL Configuration for UTF Strings Security Analysis
# This configuration ensures comprehensive security scanning for the C++23 UTF library

name: "UTF Strings Security Analysis"

# Query suites to run - focusing on security vulnerabilities
queries:
  - uses: security-extended  # Extended security queries
  - uses: security-and-quality  # Security and code quality queries

# Custom paths to analyze
paths-ignore:
  - "build/"
  - "conan-cache/"
  - ".conan2/"
  - "**/*.cmake"
  - "**/CMakeFiles/"
  - "**/*.md"
  - "**/*.txt"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.json"

# Include specific paths for analysis
paths:
  - "src/"
  - "include/"
  - "tests/"
  - "benchmarks/"
  - "fuzz/"

# Disable built-in extraction as we're using manual build
disable-default-path-filters: false

# C++ analysis will use the build commands from the workflow
# No custom build configuration needed as we handle compilation in workflow steps

# Use standard query suites - they provide comprehensive security coverage
# including CWE-119, CWE-120, CWE-190, CWE-416, CWE-787, CWE-788 and more
pack-version: latest

# Note: The security-extended and security-and-quality suites specified in the
# workflow already include comprehensive CWE coverage without needing individual packs